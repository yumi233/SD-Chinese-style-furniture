name: furniture-ai

services:
  web:
    image: ${FURNITURE_IMAGE:?FURNITURE_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: node
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      MUSHENG_PORT: "3000"
      HISTORY_DATA_DIR: /app/data/history
      MODEL_CONFIG_FILE: /app/data/config.local.json
      USER_DATA_FILE: /app/data/users/users.json
      MUSHENG_ADMIN_USER_IDS: "${MUSHENG_ADMIN_USER_IDS:-}"
      CORS_ALLOWED_ORIGINS: https://ms.yumi233.cn
      COOKIE_SECURE: "true"
      DEFAULT_ENGINE: "${DEFAULT_ENGINE:-automatic1111}"
      AUTO1111_BASE_URL: "${AUTO1111_BASE_URL:-}"
      AUTO1111_LORA: "${AUTO1111_LORA:-}"
      COMFYUI_BASE_URL: "${COMFYUI_BASE_URL:-}"
      COMFYUI_CHECKPOINT: "${COMFYUI_CHECKPOINT:-}"
      COMFYUI_WORKFLOW_FILE: "${COMFYUI_WORKFLOW_FILE:-}"
      TEXT_MODEL_ENABLED: "${TEXT_MODEL_ENABLED:-false}"
      TEXT_MODEL_BASE_URL: "${TEXT_MODEL_BASE_URL:-}"
      TEXT_MODEL_API_KEY: "${TEXT_MODEL_API_KEY:-}"
      TEXT_MODEL_NAME: "${TEXT_MODEL_NAME:-}"
      IMAGE_MODEL_BASE_URL: "${IMAGE_MODEL_BASE_URL:-}"
      IMAGE_MODEL_API_KEY: "${IMAGE_MODEL_API_KEY:-}"
      IMAGE_MODEL_NAME: "${IMAGE_MODEL_NAME:-}"
      IMAGE_MODEL_SIZE: "${IMAGE_MODEL_SIZE:-}"
      VISION_MODEL_BASE_URL: "${VISION_MODEL_BASE_URL:-}"
      VISION_MODEL_API_KEY: "${VISION_MODEL_API_KEY:-}"
      VISION_MODEL_NAME: "${VISION_MODEL_NAME:-}"
    volumes:
      - furniture-ai-data:/app/data
    networks:
      personal-hub-edge:
        aliases:
          - musheng-web
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http = require("http"); const request =
          http.get("http://127.0.0.1:3000/api/v1/live", response => {
          response.resume(); process.exit(response.statusCode === 200 ? 0 : 1);
          }); request.on("error", () => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  furniture-ai-data:
    name: furniture-ai-data

networks:
  personal-hub-edge:
    external: true
    name: personal-hub-edge

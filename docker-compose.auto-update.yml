services:
  web:
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command:
      - --label-enable
      - --interval
      - "300"
      - --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
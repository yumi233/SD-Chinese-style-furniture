<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>木生 | AI 家具设计工作台</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="brand-section">
      <a href="./index.html" class="brand-logo">
        <div class="brand-glyph">木</div>
        <span class="brand-name">木生</span>
      </a>
    </div>

    <div class="header-actions">
      <a href="#playground" class="btn btn-secondary">试玩</a>
      <a href="./studio.html" class="btn btn-primary" id="btnGoStudio">进入工作台</a>
    </div>
  </header>

  <main class="hero-container">
    <!-- 愿景主标题：一句话、简短、年轻、口语化，删掉眉标和长段落 -->
    <section class="hero-header">
      <h1 class="hero-title">说一句话，把一件家具做活、改顺、做成作品。</h1>
      <div class="hero-actions">
        <a href="./studio.html" class="btn btn-primary" style="padding: var(--space-3) var(--space-6); font-size: 15px;">开始创作</a>
        <a href="#playground" class="btn btn-secondary" style="padding: var(--space-3) var(--space-6); font-size: 15px;">上手试玩</a>
      </div>
    </section>

    <!-- 可上手操作的数字构形操场 (Live Playground) -->
    <section class="hero-playground-card" id="playground">
      <!-- 控制面板 -->
      <div class="playground-controls-panel">
        <div class="card-title-row">
          <span class="card-title">构形试玩</span>
        </div>

        <!-- 器物类型切换 -->
        <div class="prompt-input-container">
          <label class="config-label">器物</label>
          <div class="prompt-presets">
            <button class="preset-chip active" data-type="armchair">圈椅</button>
            <button class="preset-chip" data-type="table">条案</button>
            <button class="preset-chip" data-type="daybed">罗汉榻</button>
            <button class="preset-chip" data-type="shelf">博古架</button>
          </div>
        </div>

        <!-- 意境风格切换 -->
        <div class="prompt-input-container">
          <label class="config-label">风格</label>
          <div class="prompt-presets">
            <button class="preset-chip active" data-style="ming">明式</button>
            <button class="preset-chip" data-style="song">宋韵</button>
            <button class="preset-chip" data-style="contemporary">当代</button>
            <button class="preset-chip" data-style="zen">禅意</button>
          </div>
        </div>

        <!-- 渲染模式 -->
        <div class="prompt-input-container">
          <label class="config-label">画面效果</label>
          <div class="mode-segmented-control" style="width: 100%;">
            <button class="mode-btn" data-mode="solid">原画</button>
            <button class="mode-btn active" data-mode="dither">点阵</button>
            <button class="mode-btn" data-mode="ascii">字符</button>
            <button class="mode-btn" data-mode="blueprint">蓝图</button>
          </div>
        </div>

        <!-- 参数微调滑杆：全部去掉英文括注 -->
        <div class="prompt-input-container" id="ditherControls">
          <div class="config-row">
            <span class="config-label">像素大小</span>
            <span class="config-value" id="pixelVal">4px</span>
          </div>
          <input type="range" class="range-slider" id="pixelSlider" min="2" max="10" step="1" value="4">

          <div class="config-row" style="margin-top: var(--space-2);">
            <span class="config-label">纵向遮罩</span>
            <span class="config-value" id="maskVal">88%</span>
          </div>
          <input type="range" class="range-slider" id="maskSlider" min="0" max="100" step="2" value="88">
        </div>

        <button class="btn btn-primary" id="btnTransferToStudio" style="margin-top: auto; width: 100%;">
          带入工作台
        </button>
      </div>

      <!-- 画布实时预览 -->
      <div class="playground-canvas-box">
        <canvas id="playgroundCanvas" width="800" height="520"></canvas>
      </div>
    </section>

    <!-- 核心能力特性：简短清晰，无副标题堆砌 -->
    <section class="features-section">
      <div class="feature-box">
        <div class="feature-icon-badge">1</div>
        <h3 class="feature-title">分阶段推演</h3>
        <p class="feature-desc">从理解需求、起稿、出图到多维评审，随时可停，失败不扣次数。</p>
      </div>

      <div class="feature-box">
        <div class="feature-icon-badge">2</div>
        <h3 class="feature-title">框选改一处</h3>
        <p class="feature-desc">在图上直接框选部件，输入修改意见，只调整局部并生成新版本。</p>
      </div>

      <div class="feature-box">
        <div class="feature-icon-badge">3</div>
        <h3 class="feature-title">版本对比</h3>
        <p class="feature-desc">两两版本拉幕滑动对比，毫厘变化一目了然。</p>
      </div>

      <div class="feature-box">
        <div class="feature-icon-badge">4</div>
        <h3 class="feature-title">一页导出</h3>
        <p class="feature-desc">主图、点阵切片、六维评分与工艺参数排成一页展卡。</p>
      </div>
    </section>

    <!-- 首页版本对比交互演示 -->
    <section class="home-diff-demo" id="diff-demo">
      <div style="display: flex; flex-direction: column; gap: var(--space-3);">
        <h2 style="font-size: 24px; font-weight: 700;">两版拉幕对比</h2>
        <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.6;">
          拖动滑块查看初版与修改版的线条区别。
        </p>
        <div style="display: flex; gap: var(--space-4); margin-top: var(--space-2);">
          <div>
            <div style="font-size: 11px; color: var(--text-tertiary);">初版</div>
            <div style="font-weight: 600; font-size: 13px;">标准扶手</div>
          </div>
          <div>
            <div style="font-size: 11px; color: var(--accent-cyan);">改版</div>
            <div style="font-weight: 600; font-size: 13px;">扶手收窄</div>
          </div>
        </div>
      </div>

      <div class="diff-interactive-wrapper" id="homeDiffBox">
        <canvas id="homeCanvasV2" width="600" height="400" style="position: absolute; top:0; left:0; width:100%; height:100%;"></canvas>
        <div id="homeDiffClip" style="position: absolute; top:0; left:0; width:50%; height:100%; overflow:hidden; border-right: 2px solid var(--accent-cyan);">
          <canvas id="homeCanvasV1" width="600" height="400" style="position: absolute; top:0; left:0; width:100%; height:100%;"></canvas>
        </div>
        <div id="homeDiffHandle" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 28px; height: 28px; background: var(--accent-cyan); border-radius: 50%; display: grid; place-items: center; color: #000; font-weight: bold; cursor: ew-resize; box-shadow: 0 0 12px rgba(0,245,212,0.6); z-index: 10;">
          ⇔
        </div>
      </div>
    </section>
  </main>

  <script src="./furniture-engine.js"></script>
  <script>
    (function () {
      "use strict";

      const renderer = new FurnitureRenderer();
      const pCanvas = document.getElementById("playgroundCanvas");

      const state = {
        type: "armchair",
        style: "ming",
        mode: "dither",
        pixelSize: 4,
        verticalMask: 88,
        contrast: 1.25
      };

      function updatePlayground() {
        renderer.render(pCanvas, {
          type: state.type,
          style: state.style,
          mode: state.mode,
          ditherParams: {
            pixelSize: state.pixelSize,
            verticalMask: state.verticalMask,
            contrast: state.contrast
          },
          asciiParams: {
            cellSize: state.pixelSize * 2,
            scanlineMask: state.verticalMask,
            contrast: state.contrast
          }
        });
      }

      document.querySelectorAll("[data-type]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-type]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.type = btn.dataset.type;
          updatePlayground();
        });
      });

      document.querySelectorAll("[data-style]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-style]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.style = btn.dataset.style;
          updatePlayground();
        });
      });

      document.querySelectorAll("[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-mode]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.mode = btn.dataset.mode;
          updatePlayground();
        });
      });

      const pixelSlider = document.getElementById("pixelSlider");
      const pixelVal = document.getElementById("pixelVal");
      pixelSlider.addEventListener("input", (e) => {
        state.pixelSize = parseInt(e.target.value, 10);
        pixelVal.textContent = state.pixelSize + "px";
        updatePlayground();
      });

      const maskSlider = document.getElementById("maskSlider");
      const maskVal = document.getElementById("maskVal");
      maskSlider.addEventListener("input", (e) => {
        state.verticalMask = parseInt(e.target.value, 10);
        maskVal.textContent = state.verticalMask + "%";
        updatePlayground();
      });

      document.getElementById("btnTransferToStudio").addEventListener("click", () => {
        sessionStorage.setItem("musheng_preset", JSON.stringify({
          type: state.type,
          style: state.style,
          mode: state.mode
        }));
        window.location.href = "./studio.html";
      });

      // 首页对比演示渲染
      const cV1 = document.getElementById("homeCanvasV1");
      const cV2 = document.getElementById("homeCanvasV2");
      if (cV1 && cV2) {
        renderer.render(cV1, {
          type: "armchair",
          style: "ming",
          mode: "solid",
          armThinness: 1.2
        });
        renderer.render(cV2, {
          type: "armchair",
          style: "contemporary",
          mode: "solid",
          armThinness: 0.65,
          cushionColor: "#4B5563"
        });

        const diffBox = document.getElementById("homeDiffBox");
        const diffClip = document.getElementById("homeDiffClip");
        const diffHandle = document.getElementById("homeDiffHandle");
        let isDraggingDiff = false;

        function setDiffPos(clientX) {
          const rect = diffBox.getBoundingClientRect();
          let pct = ((clientX - rect.left) / rect.width) * 100;
          pct = Math.max(5, Math.min(95, pct));
          diffClip.style.width = pct + "%";
          diffHandle.style.left = pct + "%";
        }

        diffHandle.addEventListener("mousedown", () => isDraggingDiff = true);
        window.addEventListener("mouseup", () => isDraggingDiff = false);
        window.addEventListener("mousemove", (e) => {
          if (isDraggingDiff) setDiffPos(e.clientX);
        });

        diffHandle.addEventListener("touchstart", () => isDraggingDiff = true, { passive: true });
        window.addEventListener("touchend", () => isDraggingDiff = false);
        window.addEventListener("touchmove", (e) => {
          if (isDraggingDiff && e.touches[0]) setDiffPos(e.touches[0].clientX);
        }, { passive: true });
      }

      updatePlayground();
    })();
  </script>
</body>
</html>

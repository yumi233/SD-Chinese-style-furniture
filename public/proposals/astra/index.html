<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f4f6"><title>木生 · 形场 — 让想法长出下一版</title>
  <link rel="stylesheet" href="style.css"><script defer src="furniture.js"></script><script defer src="home.js"></script>
</head>
<body class="home">
  <a class="skip" href="#main">跳到内容</a>
  <header class="site-header"><a class="brand" href="index.html" aria-label="木生首页"><span class="brand-symbol" aria-hidden="true">木</span>木生<span class="brand-sub">形场</span></a><nav aria-label="主导航"><a href="#method">如何创作</a><a href="studio.html?view=history">我的作品</a><a class="button primary compact" href="studio.html">进入工作台 <span aria-hidden="true">↗</span></a></nav></header>
  <main id="main">
    <section class="hero">
      <div class="hero-heading"><h1>让想法，<br>长出<span class="blue">下一版。</span></h1><div class="hero-intro"><a class="text-link" href="studio.html">开始一件新作品 <span aria-hidden="true">↗</span></a></div></div>
      <div class="playground">
        <canvas id="hero-canvas" width="1200" height="660" role="img" aria-label="可以调整数字纹理的当代圈椅"></canvas>
        <div class="effect-dock"><div class="segmented" aria-label="数字化方式"><button data-mode="dither" aria-pressed="true">点阵</button><button data-mode="ascii" aria-pressed="false">字符</button><button data-mode="solid" aria-pressed="false">原形</button></div><label class="inline-range">颗粒 <input id="grain" type="range" min="3" max="12" value="5"><output id="grain-value">5</output></label><button id="effect-settings" class="icon-button" aria-label="展开纹理参数" aria-expanded="false">调节 <span aria-hidden="true">↗</span></button></div>
        <div id="effect-panel" class="effect-panel" hidden>
          <label>字符字号<input id="font-size" type="range" min="7" max="18" step="1" value="10"></label>
          <label>采样强度<input id="intensity" type="range" min="10" max="100" value="70"></label>
          <label>纹理尺度<input id="texture" type="range" min="1" max="4" value="2"></label>
          <label>取样区域<select id="sample"><option value="dark">暗部</option><option value="light">亮部</option></select></label>
          <label>纵向遮罩<input id="mask" type="range" min="0" max="100" value="88"></label>
        </div>
      </div>
      <form id="quick-start" class="quick-start"><label class="sr-only" for="home-prompt">你想设计的家具</label><span aria-hidden="true">＋</span><input id="home-prompt" maxlength="500" placeholder="一把适合小空间的轻盈圈椅…" aria-label="你想设计的家具"><button class="primary" type="submit">把想法放进来 <span aria-hidden="true">↗</span></button></form>
    </section>
    <section id="method" class="method"><div class="method-title"><h2>好设计，<br>不止第一眼。</h2></div><div class="method-steps"><article><span class="step-index">01</span><h3>说出来</h3></article><article><span class="step-index">02</span><h3>一起推敲</h3></article><article><span class="step-index">03</span><h3>留下更好的</h3></article></div></section>
    <section class="closing"><h2>下一件作品，<br>从你这句话开始。</h2><a class="button primary" href="studio.html">打开我的形场 <span aria-hidden="true">↗</span></a></section>
  </main>
  <footer class="site-footer"><a class="brand" href="index.html">木生<span class="brand-sub">形场</span></a><a href="studio.html?view=history">回到我的作品 ↗</a></footer>
</body>
</html>

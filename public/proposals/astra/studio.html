<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f4f6">
  <title>工作台 — 木生 · 形场</title>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="studio.css">
  <script defer src="furniture.js"></script><script defer src="app.js"></script>
</head>
<body class="studio" data-tab="brief">
  <a class="skip" href="#canvas-stage">跳到画布</a>
  <header class="studio-header">
    <a class="brand" href="index.html" aria-label="返回木生首页"><span class="brand-symbol" aria-hidden="true">木</span><span class="desktop-brand">木生</span></a>
    <button id="project-title" class="project-title" title="重命名作品">未命名作品 ⌄</button>
    <div class="header-actions"><button id="new-project" class="icon-button" aria-label="新建作品">＋</button><button id="history-open">作品集</button><button id="export-open" class="primary" disabled hidden>导出 ↗</button><button id="account-open" class="avatar" aria-label="账号">我</button></div>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main class="workbench" id="workspace">
    <section class="canvas-column" aria-label="作品">
      <div class="canvas-topline" hidden><span id="canvas-version"></span><div class="segmented" aria-label="画面效果"><button id="view-solid" aria-pressed="true">原形</button><button id="view-dither" aria-pressed="false">点阵</button><button id="view-ascii" aria-pressed="false">字符</button></div></div>
      <div class="canvas-stage" id="canvas-stage" tabindex="0" role="group" aria-label="设计画布，方向键平移，加减号缩放，零复位">
        <canvas id="work-canvas" width="1100" height="800" role="img" aria-label="家具设计画布"></canvas>
        <div id="empty-message" class="empty-message"><span aria-hidden="true">＋</span><h1>从一句话开始。</h1></div>
        <div id="selection-box" class="selection-box" hidden></div><span id="annotation-marker" class="annotation-marker" hidden>1</span>
        <div class="canvas-tools" aria-label="画布工具" hidden><button id="pan-tool" aria-pressed="true">平移</button><button id="select-tool" aria-pressed="false" disabled>框选</button><button id="annotate-tool" disabled>批注</button><span class="tool-separator"></span><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-reset" aria-label="重置画布">100%</button><button id="zoom-in" aria-label="放大">＋</button></div>
      </div>
    </section>
    <nav class="workspace-tabs" aria-label="作品操作" hidden><button data-tab="brief" aria-pressed="true">画布</button><button data-tab="review" aria-pressed="false">评审</button><button data-tab="version" aria-pressed="false">版本</button></nav>
    <aside class="review-pane floating-panel" id="review-pane" aria-labelledby="review-heading" hidden>
      <div class="panel-heading"><h2 id="review-heading">评审</h2><button class="panel-close" aria-label="收起评审">×</button></div>
      <p id="review-empty" hidden>待评审</p>
      <div id="review-content" hidden>
        <div class="review-summary"><strong id="total-score">82</strong><span>/ 100</span></div>
        <div id="score-list" class="score-list"></div>
        <div class="suggestion"><h3 id="suggestion-title">收薄横向构件</h3><button id="apply-suggestion">采用建议 ↗</button></div>
        <div class="edit-composer"><label for="edit-prompt">修改意见</label><textarea id="edit-prompt" rows="2" maxlength="500" placeholder="保留环抱感，把扶手变薄…"></textarea><button id="apply-edit" class="primary full">修改这一版 ↗</button></div>
        <details class="version-options"><summary>更多操作</summary><button id="rerun" class="full ghost">同参数重跑</button><button id="restore-description" class="full ghost">回填这一版需求</button></details>
        <div id="annotations" class="annotations"></div>
      </div>
    </aside>
    <section class="version-pane floating-panel" id="version-pane" aria-labelledby="versions-heading" hidden>
      <div class="panel-heading"><h2 id="versions-heading">版本 <span id="version-count">0</span></h2><div><button id="compare-open" disabled>比较 ⇄</button><button class="panel-close" aria-label="收起版本">×</button></div></div>
      <div id="version-list" class="version-list"></div>
    </section>
    <section id="progress-panel" class="progress-panel" hidden aria-live="polite">
      <div class="progress-heading"><strong id="progress-label">理解需求</strong><button id="stop-generation">停止</button></div>
      <ol id="stages"><li>理解需求</li><li>起稿</li><li>出图</li><li>评审</li></ol><progress id="progress" max="4" value="0" aria-label="生成进度"></progress>
    </section>
    <div id="selection-editor" class="selection-editor" hidden>
      <div class="panel-heading"><label for="local-edit">修改选区</label><button id="cancel-selection" aria-label="取消框选">×</button></div>
      <input id="local-edit" maxlength="300" placeholder="扶手再薄一点…"><button id="apply-local" class="primary">生成新版本 ↗</button>
    </div>
    <section class="composer" id="brief-pane" aria-label="需求输入">
      <form id="generate-form">
        <label for="prompt" class="sr-only">家具需求</label><textarea id="prompt" rows="2" maxlength="1200" placeholder="描述你想设计的家具…" required></textarea>
        <div class="composer-actions"><button id="settings-open" type="button" aria-haspopup="dialog">设置</button><div class="examples"><button type="button" data-example="chair">圈椅</button><button type="button" data-example="table">茶桌</button><button type="button" data-example="cabinet">边柜</button></div><button id="generate" class="primary" type="submit">生成 ↗</button></div>
      </form>
    </section>
  </main>
  <span id="save-status" class="sr-only" role="status"></span>
  <dialog id="settings-modal" aria-labelledby="settings-heading">
    <div class="modal-heading"><h2 id="settings-heading">设计设置</h2><button id="settings-close" class="icon-button" aria-label="关闭设置">×</button></div>
    <div class="settings-content">
      <fieldset class="style-picker"><legend>风格</legend><div class="style-grid"><label><input type="radio" name="style" value="明式"><span>明式</span></label><label><input type="radio" name="style" value="新中式" checked><span>新中式</span></label><label><input type="radio" name="style" value="宋韵"><span>宋韵</span></label><label><input type="radio" name="style" value="禅意"><span>禅意</span></label></div></fieldset>
      <details class="parameters"><summary>构图与生成</summary><div class="details-content"><label>画面<select id="ratio"><option value="16:9-720">16:9 · 720p</option><option value="16:9-1080">16:9 · 1080p</option><option value="4:3-720">4:3 · 720p</option><option value="4:3-1080">4:3 · 1080p</option></select></label><div class="two-fields"><label>精细度<select id="detail"><option>标准</option><option>精细</option></select></label><label>氛围<select id="mood"><option>自然光</option><option>展厅</option><option>居家</option></select></label></div><label>约束<input id="constraints" maxlength="300" placeholder="不要金属与软包"></label><label class="check-row"><input id="auto-iterate" type="checkbox">自动优化</label><div class="two-fields"><label>目标分<input id="target" type="number" min="60" max="100" value="85"></label><label>最多轮数<select id="rounds"><option>1</option><option selected>2</option><option>3</option></select></label></div></div></details>
      <details class="parameters"><summary>英文提示词</summary><textarea id="english-prompt" rows="4" aria-label="英文提示词"></textarea></details>
      <details class="parameters"><summary>设计记忆</summary><label class="check-row"><input id="lock-material" type="checkbox" checked>锁定白蜡木</label><label class="check-row"><input id="lock-proportion" type="checkbox">锁定比例</label></details>
      <div class="settings-utilities"><button id="keyboard-help">快捷键</button><button id="demo-open">状态演练</button></div>
    </div>
    <button id="settings-done" class="primary full">完成</button>
  </dialog>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="关闭弹窗">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>

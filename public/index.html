<!doctype html>
<html lang="zh-CN" data-theme="day" data-locale="cn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="木生·AI，用一句话开始设计家具。" />
    <title data-ui-copy>木生·AI — 一句话，长出一件家具</title>
    <link rel="icon" href="/assets/brand/musheng-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/assets/hero-wide.webp" media="(min-width: 721px)" />
    <link rel="preload" as="image" href="/assets/hero-tall.webp" media="(max-width: 720px)" />
    <link rel="stylesheet" href="/vendor/yui/tokens.css" />
    <link rel="stylesheet" href="/vendor/yui/components.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/home-demo.css" />
    <link rel="stylesheet" href="/css/home-works.css" />
  </head>
  <body class="home">
    <a class="skip-link" href="#main" data-ui-copy>跳到主要内容</a>

    <header class="home-head">
      <a class="home-brand" href="/" aria-label="木生首页" data-ui-attrs="aria-label">
        <img class="home-brand__mark" src="/assets/brand/musheng-icon-64.png" srcset="/assets/brand/musheng-icon-64.png 2x, /assets/brand/musheng-icon-96.png 3x" width="32" height="32" alt="" />
        <span data-ui-copy>木生</span>
      </a>
      <nav class="home-head__links" aria-label="主导航" data-ui-attrs="aria-label">
        <div class="yui-segmented locale-switch" role="group" aria-label="语言" data-ui-attrs="aria-label" data-locale-switch><button class="yui-segment" type="button" data-locale-set="cn" lang="zh-CN" aria-pressed="true">中</button><button class="yui-segment" type="button" data-locale-set="tw" lang="zh-TW" aria-pressed="false">繁</button><button class="yui-segment" type="button" data-locale-set="en" lang="en" aria-pressed="false">EN</button></div>
        <a href="/login.html?next=%2Fstudio" data-cn="登录" data-tw="登入">登录</a>
        <a class="home-head__cta" href="/studio" data-cn="打开工作台" data-tw="打開工作臺">打开工作台</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__art">
          <picture>
            <source media="(max-width: 720px)" srcset="/assets/hero-tall.webp" width="1080" height="1320" />
            <img src="/assets/hero-wide.webp" width="2560" height="1430" alt="晨光里的一把浅木椅，由绿色字符组成" fetchpriority="high" data-ui-attrs="alt" />
          </picture>
        </div>
        <div class="hero__copy">
          <h1 id="hero-title" class="hero__title">
            <span data-cn="一句话，" data-tw="一句話，">一句话，</span>
            <em data-cn="长出一件家具。" data-tw="長出一件家具。">长出一件家具。</em>
          </h1>
          <form class="hero__prompt" id="heroPrompt" action="/studio" role="search">
            <label class="sr-only" for="homePrompt" data-ui-copy>描述一件家具</label>
            <input id="homePrompt" name="prompt" autocomplete="off" placeholder="一把浅木小椅子，轻一点" data-placeholder-cn="一把浅木小椅子，轻一点" data-placeholder-tw="一把淺木小椅子，輕一點" />
            <button class="yui-button--arrow" type="submit"><span data-cn="开始设计" data-tw="開始設計">开始设计</span><span class="yui-button__arrow" aria-hidden="true">→</span></button>
          </form>
          <div class="hero__seeds" aria-label="试试" data-ui-attrs="aria-label">
            <button type="button" data-seed="一张留白的茶桌，胡桃木" data-ui-copy>留白茶桌</button>
            <button type="button" data-seed="靠窗的单椅，白蜡木，靠背高一点" data-ui-copy>靠窗单椅</button>
            <button type="button" data-seed="一组竹木矮柜，适合玄关" data-ui-copy>竹木矮柜</button>
          </div>
        </div>
      </section>

      <section class="studio-demo" id="studioDemo" aria-labelledby="demo-title">
        <h2 class="section-title" id="demo-title" data-cn="一件作品，四个动作。" data-tw="一件作品，四個動作。">一件作品，四个动作。</h2>
        <div class="demo-window" id="demoWindow">
          <header class="demo-window__bar">
            <span class="demo-window__dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <div class="yui-segmented demo-steps" id="demoSteps" role="group" aria-label="演示步骤" data-ui-attrs="aria-label">
              <button class="yui-segment" type="button" data-demo-step="0" aria-pressed="true" data-ui-copy><span class="yui-index">01</span>生成</button>
              <button class="yui-segment" type="button" data-demo-step="1" aria-pressed="false" data-ui-copy><span class="yui-index">02</span>修改</button>
              <button class="yui-segment" type="button" data-demo-step="2" aria-pressed="false" data-ui-copy><span class="yui-index">03</span>对比</button>
              <button class="yui-segment" type="button" data-demo-step="3" aria-pressed="false" data-ui-copy><span class="yui-index">04</span>导出</button>
            </div>
            <img class="demo-window__mark" src="/assets/brand/musheng-icon-64.png" srcset="/assets/brand/musheng-icon-64.png 2x, /assets/brand/musheng-icon-96.png 3x" width="20" height="20" alt="" />
          </header>
          <div class="demo-stage" id="demoStage" data-scene="generate" data-count="1" aria-hidden="true">
            <div class="demo-composer" id="demoComposer"><span id="demoTyped" data-ui-copy></span><i class="demo-caret"></i></div>
            <div class="demo-row" id="demoRow">
              <article class="demo-card" id="demoV1" data-card="1">
                <header><span class="yui-index">v1</span><span class="demo-card__score mono">88</span></header>
                <div class="demo-card__media">
                  <img class="demo-card__ascii" src="/assets/hero-tall.webp" alt="" />
                  <img class="demo-card__photo" src="/assets/hero-meadow.png" alt="第一版浅木椅" style="object-position: 72% 60%" data-ui-attrs="alt" />
                  <span class="demo-card__scan" aria-hidden="true"></span>
                </div>
              </article>
              <span class="demo-edge" id="demoEdge"></span>
              <article class="demo-card" id="demoV2" data-card="2">
                <header><span class="yui-index">v2</span><span class="demo-card__score mono">92</span></header>
                <div class="demo-card__media">
                  <img class="demo-card__ascii" src="/assets/hero-tall.webp" alt="" />
                  <img class="demo-card__photo" src="/assets/chair-v2.webp" alt="靠背更薄的第二版浅木椅" style="object-position: 72% 60%" data-ui-attrs="alt" />
                  <span class="demo-card__scan" aria-hidden="true"></span>
                </div>
              </article>
            </div>
            <span class="demo-frame" id="demoFrame"></span>
            <span class="demo-bubble" id="demoBubble"><span id="demoAsk" data-ui-copy></span></span>
            <div class="demo-panel demo-compare" id="demoCompare">
              <img src="/assets/hero-meadow.png" alt="" style="object-position: 72% 60%" />
              <div class="demo-compare__after"><img src="/assets/chair-v2.webp" alt="" style="object-position: 72% 60%" /></div>
              <span class="demo-compare__line"><i></i></span>
              <span class="demo-compare__tag mono">v1</span><span class="demo-compare__tag demo-compare__tag--b mono">v2</span>
            </div>
            <div class="demo-panel demo-sheet" id="demoSheet">
              <img src="/assets/chair-v2.webp" alt="" style="object-position: 72% 60%" />
              <div class="demo-sheet__text">
                <p class="yui-index">v2 · 2026.11</p>
                <strong data-ui-copy>浅木小椅</strong>
                <ul class="demo-sheet__dims"></ul>
              </div>
            </div>
            <span class="demo-cursor demo-cursor--agent" id="demoAgent" data-ui-copy><i></i>木生</span>
            <span class="demo-cursor demo-cursor--you" id="demoYou" data-ui-copy><i></i>你</span>
          </div>
          <footer class="demo-window__tools" aria-hidden="true">
            <span class="demo-status mono" id="demoStatus" data-ui-copy>v1 · 88</span>
            <span class="demo-export" id="demoExport" data-ui-copy>导出</span>
          </footer>
        </div>
      </section>

      <section class="works" aria-labelledby="works-title">
        <h2 class="section-title" id="works-title" data-cn="都从一句话开始。" data-tw="都從一句話開始。">都从一句话开始。</h2>
        <div class="works__grid">
          <figure class="work" tabindex="0">
            <div class="work__media">
              <img class="work__ascii" src="/assets/works/chair-ascii.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <img class="work__photo" src="/assets/works/chair.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <span class="work__scan" aria-hidden="true"></span>
            </div>
            <figcaption><span class="yui-index">01</span><span data-cn="一把浅木小椅子，靠背薄一点" data-tw="一把淺木小椅子，靠背薄一點">一把浅木小椅子，靠背薄一点</span></figcaption>
          </figure>
          <figure class="work" tabindex="0">
            <div class="work__media">
              <img class="work__ascii" src="/assets/works/table-ascii.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <img class="work__photo" src="/assets/works/table.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <span class="work__scan" aria-hidden="true"></span>
            </div>
            <figcaption><span class="yui-index">02</span><span data-cn="一张留白的茶桌，细腿" data-tw="一張留白的茶桌，細腿">一张留白的茶桌，细腿</span></figcaption>
          </figure>
          <figure class="work" tabindex="0">
            <div class="work__media">
              <img class="work__ascii" src="/assets/works/cabinet-ascii.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <img class="work__photo" src="/assets/works/cabinet.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <span class="work__scan" aria-hidden="true"></span>
            </div>
            <figcaption><span class="yui-index">03</span><span data-cn="两扇门的矮柜，放在玄关" data-tw="兩扇門的矮櫃，放在玄關">两扇门的矮柜，放在玄关</span></figcaption>
          </figure>
          <figure class="work" tabindex="0">
            <div class="work__media">
              <img class="work__ascii" src="/assets/works/daybed-ascii.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <img class="work__photo" src="/assets/works/daybed.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <span class="work__scan" aria-hidden="true"></span>
            </div>
            <figcaption><span class="yui-index">04</span><span data-cn="一张能午睡的矮榻，亚麻垫" data-tw="一張能午睡的矮榻，亞麻墊">一张能午睡的矮榻，亚麻垫</span></figcaption>
          </figure>
          <figure class="work" tabindex="0">
            <div class="work__media">
              <img class="work__ascii" src="/assets/works/bookshelf-ascii.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <img class="work__photo" src="/assets/works/bookshelf.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <span class="work__scan" aria-hidden="true"></span>
            </div>
            <figcaption><span class="yui-index">05</span><span data-cn="四层空书架，轻一点" data-tw="四層空書架，輕一點">四层空书架，轻一点</span></figcaption>
          </figure>
          <figure class="work" tabindex="0">
            <div class="work__media">
              <img class="work__ascii" src="/assets/works/stool-ascii.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <img class="work__photo" src="/assets/works/stool.webp" width="1080" height="1350" alt="" loading="lazy" decoding="async" />
              <span class="work__scan" aria-hidden="true"></span>
            </div>
            <figcaption><span class="yui-index">06</span><span data-cn="圆面小凳，脚下有横枨" data-tw="圓面小凳，腳下有橫棖">圆面小凳，脚下有横枨</span></figcaption>
          </figure>
        </div>
      </section>

      <section class="end" aria-labelledby="end-title">
        <h2 id="end-title" data-cn="从一件开始。" data-tw="從一件開始。">从一件开始。</h2>
        <a class="end__cta yui-button--arrow" href="/studio"><span data-cn="打开工作台" data-tw="打開工作臺">打开工作台</span><span class="yui-button__arrow" aria-hidden="true">→</span></a>
      </section>
    </main>

    <footer class="home-foot">
      <span data-ui-copy>木生·AI</span>
      <span class="mono">2026</span>
    </footer>

    <nav class="dock" data-site-dock aria-label="快捷" data-ui-attrs="aria-label">
      <a class="dock__item dock__item--text" href="#main" data-cn="顶部" data-tw="頂部">顶部</a>
      <span class="dock__sep" aria-hidden="true"></span>
      <button class="dock__item dock__item--text" type="button" data-theme-toggle aria-pressed="false" data-ui-copy>夜间</button>
    </nav>

    <script type="module" src="/js/home.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="day" data-locale="cn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="木生·AI，用一句话开始设计家具。" />
    <title>木生·AI — 一句话，长出一件家具</title>
    <link rel="icon" href="/assets/musheng-ai-logo.png" type="image/png" />
    <link rel="stylesheet" href="/ui/tokens.css" />
    <link rel="stylesheet" href="/ui/components.css" />
    <link rel="stylesheet" href="/ui/ascii-field.css" />
    <link rel="stylesheet" href="/css/home.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="home-nav" data-site-dock>
      <nav class="home-nav__glass" aria-label="主导航">
        <a class="home-nav__brand" href="/" aria-label="木生首页">木生</a>
        <div class="home-nav__links">
          <a href="#one-by-one">一格一格</a>
          <a href="#frame-it">框住它</a>
          <a href="#growth">六圈年轮</a>
        </div>
        <div class="home-nav__actions">
          <a class="home-nav__login" href="/login.html?next=%2Fstudio">登录</a>
          <a class="home-nav__studio" href="/studio">打开工作台</a>
          <details class="home-nav__preferences">
            <summary aria-label="显示偏好">•••</summary>
            <div class="home-nav__preferences-panel">
              <button type="button" data-theme-toggle aria-pressed="false">夜间</button>
              <button type="button" data-locale-toggle aria-pressed="false">繁體</button>
            </div>
          </details>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="home-hero" aria-labelledby="hero-title">
        <div class="home-hero__visual">
          <div class="home-hero__field" id="heroField"></div>
          <h1 class="home-hero__title" id="hero-title">
            <span>一句话，</span>
            <span>长出一件家具。</span>
          </h1>
        </div>

        <div class="home-try">
          <form class="home-try__form" id="heroPromptForm" action="/studio" method="get">
            <label class="sr-only" for="homePrompt">描述你想设计的家具</label>
            <textarea
              class="home-try__input"
              id="homePrompt"
              name="prompt"
              rows="5"
              placeholder="一把给小公寓的椅子，浅木，轻一点"
            ></textarea>
            <div class="home-try__chips" aria-label="快捷描述">
              <button type="button" data-prompt="一把给小公寓的椅子，浅木，轻一点">小户型</button>
              <button type="button" data-prompt="一张低矮的浅木茶桌，边缘要很薄">浅木茶桌</button>
              <button type="button" data-prompt="一把靠窗的单椅，线条安静，坐感松一点">靠窗单椅</button>
            </div>
            <button class="home-try__submit" id="startDesign" type="submit">开始设计</button>
          </form>
        </div>
      </section>

      <section class="home-section step-section" id="one-by-one" aria-labelledby="step-title">
        <h2 class="section-title" id="step-title">一格一格</h2>
        <div class="step-card">
          <div class="step-card__visual" id="stepField"></div>
          <div class="step-card__controls">
            <div class="step-filter" role="group" aria-label="渲染方式">
              <button class="is-active" type="button" data-step-filter="ascii" aria-pressed="true">ASCII</button>
              <button type="button" data-step-filter="dither" aria-pressed="false">Dither</button>
            </div>
            <label class="step-control" for="granularityRange">
              <span>颗粒</span>
              <output id="granularityValue" for="granularityRange">46</output>
              <input id="granularityRange" type="range" min="0" max="100" value="46" />
            </label>
            <label class="step-control" for="disintegrateRange">
              <span>解体</span>
              <output id="disintegrateValue" for="disintegrateRange">24</output>
              <input id="disintegrateRange" type="range" min="0" max="100" value="24" />
            </label>
          </div>
        </div>
      </section>

      <section class="home-section frame-section" id="frame-it" aria-labelledby="frame-title">
        <div class="frame-section__head">
          <h2 class="section-title" id="frame-title">框住它，说一句</h2>
          <span class="frame-version" id="refineVersion" aria-live="polite">v1</span>
        </div>
        <div class="crop-stage" id="cropDemo">
          <canvas class="crop-stage__image" id="chairCropCanvas" aria-label="浅木椅子的局部"></canvas>
          <div class="crop-stage__dither" id="refineDither" aria-hidden="true"></div>
          <div
            class="crop-frame"
            id="cropFrame"
            role="group"
            tabindex="0"
            aria-label="选择想修改的区域，可用方向键移动"
          >
            <span class="crop-frame__corner" aria-hidden="true"></span>
          </div>
          <div class="refine-bubble" id="refineBubble" hidden>
            <button id="refineButton" type="button">再薄一点</button>
          </div>
          <p class="sr-only" id="refineStatus" aria-live="polite">已选择椅子靠背区域</p>
        </div>
      </section>

      <section class="home-section growth-section" id="growth" aria-labelledby="growth-title">
        <h2 class="section-title" id="growth-title">六圈年轮</h2>
        <div class="growth-layout">
          <div class="growth-rings" id="growthRings" aria-hidden="true">
            <svg viewBox="0 0 320 320">
              <circle class="growth-ring-track" cx="160" cy="160" r="116"></circle>
              <circle class="growth-ring-track" cx="160" cy="160" r="94"></circle>
              <circle class="growth-ring-track" cx="160" cy="160" r="72"></circle>
              <circle class="growth-ring-track" cx="160" cy="160" r="50"></circle>
              <circle class="growth-ring-track" cx="160" cy="160" r="28"></circle>
              <circle class="growth-ring-track" cx="160" cy="160" r="8"></circle>
              <circle class="growth-ring" cx="160" cy="160" r="116" pathLength="100" style="--score: 92; --ring-color: var(--ring-0)"></circle>
              <circle class="growth-ring" cx="160" cy="160" r="94" pathLength="100" style="--score: 88; --ring-color: var(--ring-1)"></circle>
              <circle class="growth-ring" cx="160" cy="160" r="72" pathLength="100" style="--score: 85; --ring-color: var(--ring-2)"></circle>
              <circle class="growth-ring" cx="160" cy="160" r="50" pathLength="100" style="--score: 90; --ring-color: var(--ring-3)"></circle>
              <circle class="growth-ring" cx="160" cy="160" r="28" pathLength="100" style="--score: 87; --ring-color: var(--ring-4)"></circle>
              <circle class="growth-ring" cx="160" cy="160" r="8" pathLength="100" style="--score: 78; --ring-color: var(--ring-5)"></circle>
            </svg>
          </div>
          <ul class="growth-legend">
            <li><i style="--ring-color: var(--ring-0)"></i><span>文化准确性</span><strong>92</strong></li>
            <li><i style="--ring-color: var(--ring-1)"></i><span>结构合理性</span><strong>88</strong></li>
            <li><i style="--ring-color: var(--ring-2)"></i><span>材料工艺</span><strong>85</strong></li>
            <li><i style="--ring-color: var(--ring-3)"></i><span>设计创新</span><strong>90</strong></li>
            <li><i style="--ring-color: var(--ring-4)"></i><span>场景适配</span><strong>87</strong></li>
            <li><i style="--ring-color: var(--ring-5)"></i><span>AI 使用</span><strong>78</strong></li>
          </ul>
        </div>
      </section>

      <section class="home-end" aria-labelledby="end-title">
        <h2 id="end-title">
          <span class="home-end__ink">让下一件家具，</span>
          <span>从一句话开始。</span>
        </h2>
        <a class="home-end__action" href="/studio">打开工作台</a>
      </section>
    </main>

    <footer class="home-footer">
      <span>木生·AI</span>
      <a href="/login.html?next=%2Fstudio">登录</a>
      <span>© 2026</span>
    </footer>

    <script type="module" src="/js/home.js"></script>
  </body>
</html>

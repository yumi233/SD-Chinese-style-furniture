<!doctype html>
<html lang="zh-CN" data-theme="day" data-locale="cn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="木生·AI，用一句话开始设计家具。" />
    <title>木生·AI — 一句话，长出一件家具</title>
    <link rel="icon" href="/assets/musheng-ai-logo.png" type="image/png" />
    <link rel="preload" as="image" href="/assets/hero-wide.webp" media="(min-width: 721px)" />
    <link rel="preload" as="image" href="/assets/hero-tall.webp" media="(max-width: 720px)" />
    <link rel="stylesheet" href="/ui/tokens.css" />
    <link rel="stylesheet" href="/ui/components.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/home-demo.css" />
  </head>
  <body class="home">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="home-head">
      <a class="home-brand" href="/" aria-label="木生首页">
        <span class="home-brand__mark" aria-hidden="true">木</span>
        <span>木生</span>
      </a>
      <nav class="home-head__links" aria-label="主导航">
        <a href="/login.html?next=%2Fstudio" data-cn="登录" data-tw="登入">登录</a>
        <a class="home-head__cta" href="/studio" data-cn="打开工作台" data-tw="打開工作臺">打开工作台</a>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__art">
          <picture>
            <source media="(max-width: 720px)" srcset="/assets/hero-tall.webp" width="1080" height="1320" />
            <img src="/assets/hero-wide.webp" width="2560" height="1430" alt="晨光里的一把浅木椅，由绿色字符组成" fetchpriority="high" />
          </picture>
        </div>
        <div class="hero__copy">
          <h1 id="hero-title" class="hero__title">
            <span data-cn="一句话，" data-tw="一句話，">一句话，</span>
            <em data-cn="长出一件家具。" data-tw="長出一件家具。">长出一件家具。</em>
          </h1>
          <form class="hero__prompt" id="heroPrompt" action="/studio" role="search">
            <label class="sr-only" for="homePrompt">描述一件家具</label>
            <input id="homePrompt" name="prompt" autocomplete="off" placeholder="一把浅木小椅子，轻一点" data-placeholder-cn="一把浅木小椅子，轻一点" data-placeholder-tw="一把淺木小椅子，輕一點" />
            <button class="yui-button--arrow" type="submit"><span data-cn="开始设计" data-tw="開始設計">开始设计</span><span class="yui-button__arrow" aria-hidden="true">→</span></button>
          </form>
          <div class="hero__seeds" aria-label="试试">
            <button type="button" data-seed="一张留白的茶桌，胡桃木">留白茶桌</button>
            <button type="button" data-seed="靠窗的单椅，白蜡木，靠背高一点">靠窗单椅</button>
            <button type="button" data-seed="一组竹木矮柜，适合玄关">竹木矮柜</button>
          </div>
        </div>
      </section>

      <section class="studio-demo" id="studioDemo" aria-labelledby="demo-title">
        <h2 class="section-title" id="demo-title" data-cn="直接试一次。" data-tw="直接試一次。">直接试一次。</h2>
        <div class="studio-demo__steps" id="demoSteps" role="group" aria-label="演示步骤">
          <button class="demo-step is-active" type="button" data-demo-step="0" aria-pressed="true">
            <span class="demo-step__number yui-index">01</span>
            <span class="demo-step__copy"><strong data-cn="生成" data-tw="生成">生成</strong><span data-cn="一句话，起一稿。" data-tw="一句話，起一稿。">一句话，起一稿。</span></span>
          </button>
          <button class="demo-step" type="button" data-demo-step="1" aria-pressed="false">
            <span class="demo-step__number yui-index">02</span>
            <span class="demo-step__copy"><strong data-cn="修改" data-tw="修改">修改</strong><span data-cn="框住一处，接着说。" data-tw="框住一處，接著說。">框住一处，接着说。</span></span>
          </button>
          <button class="demo-step" type="button" data-demo-step="2" aria-pressed="false">
            <span class="demo-step__number yui-index">03</span>
            <span class="demo-step__copy"><strong data-cn="对比" data-tw="對比">对比</strong><span data-cn="拖动分界，看见变化。" data-tw="拖動分界，看見變化。">拖动分界，看见变化。</span></span>
          </button>
          <button class="demo-step" type="button" data-demo-step="3" aria-pressed="false">
            <span class="demo-step__number yui-index">04</span>
            <span class="demo-step__copy"><strong data-cn="导出" data-tw="導出">导出</strong><span data-cn="把选定的一版带走。" data-tw="把選定的一版帶走。">把选定的一版带走。</span></span>
          </button>
        </div>

        <div class="studio-demo__stage">
          <div class="demo-window" id="demoWindow">
            <header class="demo-window__bar">
              <span class="demo-window__dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="demo-window__address">musheng.ai/studio</span>
              <span class="demo-window__mark" aria-hidden="true">木</span>
            </header>
            <div class="demo-window__body">
              <div class="demo-canvas" id="demoCanvas" tabindex="0" aria-label="版本画布，方向键平移" aria-describedby="demoHelp">
                <div class="demo-world" id="demoWorld">
                  <svg class="demo-edges" id="demoEdges" width="1200" height="720" aria-hidden="true"></svg>
                  <div id="demoCards"></div>
                </div>
                <div class="demo-draft" id="demoDraft" hidden>
                  <span id="demoDraftText">一把给小公寓的椅子</span>
                  <button class="yui-button" data-variant="primary" id="demoGenerate" type="button">生成</button>
                </div>
                <div class="demo-cursor demo-cursor--agent" id="demoAgentCursor" aria-hidden="true"><i></i>木生</div>
                <div class="demo-cursor demo-cursor--you" id="demoYouCursor" aria-hidden="true"><i></i>你</div>
                <p class="sr-only" id="demoHelp">可用卡片上的改扶手按钮代替拖框；对比分界线也可用方向键操作。</p>
              </div>
              <footer class="demo-window__tools">
                <div class="yui-segmented demo-mode" role="group" aria-label="操作">
                  <button class="yui-segment" id="demoModifyMode" type="button" aria-pressed="true">改一处</button>
                  <button class="yui-segment" id="demoCompareMode" type="button" aria-pressed="false">对比</button>
                </div>
                <span class="demo-status" id="demoStatus" role="status" aria-live="polite">v1 · 88</span>
                <button class="yui-button yui-button--sm" data-variant="secondary" id="demoExport" type="button">导出</button>
              </footer>
            </div>
            <form class="demo-bubble" id="demoBubble" hidden>
              <label class="sr-only" for="demoChange">修改内容</label>
              <input class="yui-input" id="demoChange" value="扶手再薄一点" maxlength="40" required />
              <button class="yui-button" data-variant="primary" type="submit">生成修改版</button>
            </form>
            <div class="demo-compare" id="demoCompare" hidden>
              <header><strong class="yui-index">v1 / v2</strong><button class="yui-button yui-button--sm" data-variant="secondary" id="demoCompareClose" type="button">返回画布</button></header>
              <div class="demo-compare__stage" id="demoCompareStage">
                <img src="/assets/hero-meadow.png" alt="第一版浅木椅" />
                <div class="demo-compare__after"><img src="/assets/hero-tall.webp" alt="扶手更薄的第二版浅木椅" /></div>
                <span class="demo-compare__line" aria-hidden="true"></span>
                <input id="demoCompareSlider" type="range" min="0" max="100" value="50" aria-label="版本对比分界线" />
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="end" aria-labelledby="end-title">
        <h2 id="end-title" data-cn="从一件开始。" data-tw="從一件開始。">从一件开始。</h2>
        <a class="end__cta yui-button--arrow" href="/studio"><span data-cn="打开工作台" data-tw="打開工作臺">打开工作台</span><span class="yui-button__arrow" aria-hidden="true">→</span></a>
      </section>
    </main>

    <footer class="home-foot">
      <span>木生·AI</span>
      <span class="mono">2026</span>
    </footer>

    <nav class="dock" data-site-dock aria-label="快捷">
      <a class="dock__item" href="#main" aria-label="回到顶部" data-tip="顶部">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </a>
      <a class="dock__item" href="/studio" aria-label="工作台" data-tip="工作台">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 4v16"/></svg>
      </a>
      <span class="dock__sep" aria-hidden="true"></span>
      <button class="dock__item dock__item--text" type="button" data-theme-toggle aria-pressed="false">夜间</button>
      <button class="dock__item dock__item--text" type="button" data-locale-toggle aria-pressed="false">繁體</button>
    </nav>

    <script type="module" src="/js/home.js"></script>
  </body>
</html>

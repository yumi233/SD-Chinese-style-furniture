<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>按钮与文字 · 三个方向</title>
<link rel="stylesheet" href="/ui/tokens.css" />
<link rel="stylesheet" href="/ui/components.css" />
<style>
  /* Specimen only. Every spacing and radius is on the 4px grid; inner radius = outer − padding. */
  body { margin: 0; background: var(--grain), var(--paper); color: var(--ink); }
  .wrap { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 96px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  .col { display: grid; align-content: start; gap: 24px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius-4xl); background: var(--surface); }
  .tag { font: 600 13px var(--font-mono); color: var(--sub); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  h1, h2, p { margin: 0; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  /* A · 刻度: mono index labels, dark pill with a round arrow badge (pill, padding 4 → circle). */
  .a .meta { display: flex; gap: 12px; font: 500 12px var(--font-mono); color: var(--sub); text-transform: uppercase; letter-spacing: .04em; }
  .a .meta b { color: var(--olive); font-weight: 600; }
  .a h1 { font-size: 40px; font-weight: 700; line-height: 1.12; letter-spacing: -.03em; }
  .a h1 span { color: var(--olive); }
  .a p { color: var(--sub); font-size: 15px; line-height: 1.8; }
  .a .btn { display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 4px 4px 4px 20px; border: 0; border-radius: var(--radius-full); background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600; }
  .a .btn i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--olive); color: #fff; font-style: normal; transition: transform var(--motion-fast) var(--ease-spring); }
  .a .btn:hover i { transform: rotate(45deg); }
  .a .btn--line { padding: 0 20px; background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .a .link { position: relative; font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .a .link::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: currentColor; transform-origin: right; transition: transform var(--motion-base) var(--ease-standard); }
  .a .link:hover::after { transform: scaleX(.3); }
  .a .chip { height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); font: 500 12px var(--font-mono); }
  .a .chip::before { content: "+"; color: var(--olive); }

  /* B · 材质: the Figma acrylic feel — gradients, inner highlights, frosted secondary, weight contrast. */
  .b h1 { font-size: 40px; font-weight: 300; line-height: 1.16; letter-spacing: -.02em; }
  .b h1 strong { font-weight: 700; }
  .b .eyebrowless { display: inline-flex; align-items: center; gap: 8px; width: fit-content; height: 28px; padding: 0 12px 0 4px; border-radius: var(--radius-full); background: var(--muted-bg); font-size: 12px; color: var(--sub); }
  .b .eyebrowless i { display: grid; place-items: center; height: 20px; padding: 0 8px; border-radius: var(--radius-full); background: var(--surface); color: var(--olive); font: 600 11px var(--font-mono); font-style: normal; box-shadow: var(--shadow-sm); }
  .b p { color: var(--sub); font-size: 15px; line-height: 1.8; }
  .b .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; border: 1px solid #00000040; border-radius: var(--radius-md); background: linear-gradient(180deg, #3A3A3A, #1E1E1E); color: #fff; font-size: 15px; font-weight: 600; box-shadow: inset 0 1px 0 #ffffff33, 0 1px 2px #0000001f, 0 8px 16px -8px #0000004d; transition: transform var(--motion-fast) var(--ease-spring); }
  .b .btn:active { transform: scale(.97); }
  .b .btn--glass { border: 1px solid var(--line); background: linear-gradient(180deg, #ffffff, #F4F4F4); color: var(--ink); box-shadow: inset 0 1px 0 #fff, 0 1px 2px #0000000f; }
  .b .btn--olive { border-color: #3F4B2C; background: linear-gradient(180deg, #6E8150, #56663D); }
  .b .seg { display: inline-flex; padding: 4px; border-radius: var(--radius-md); background: var(--muted-bg); box-shadow: inset 0 1px 2px #0000000f; }
  .b .seg button { height: 32px; padding: 0 16px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--sub); font-size: 13px; }
  .b .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px #0000001f; }

  /* C · 编辑: big numerals, olive marker under key words, round arrow links, outlined pills. */
  .c .num { font: 700 64px/1 var(--font-mono); letter-spacing: -.04em; color: var(--line); }
  .c h1 { font-size: 40px; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; }
  .c h1 mark { padding: 0 4px; background: linear-gradient(transparent 60%, color-mix(in srgb, var(--sage) 45%, transparent) 60%); color: inherit; }
  .c p { font-size: 15px; line-height: 1.8; color: var(--sub); }
  .c .go { display: inline-flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; color: var(--ink); text-decoration: none; }
  .c .go i { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--ink); border-radius: 50%; font-style: normal; transition: background var(--motion-fast), color var(--motion-fast); }
  .c .go:hover i { background: var(--ink); color: var(--paper); }
  .c .btn { height: 44px; padding: 0 20px; border: 1px solid var(--ink); border-radius: var(--radius-full); background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; }
  .c .btn--fill { background: var(--olive); border-color: var(--olive); color: #fff; }
  .c .chip { height: 32px; padding: 0 16px; border: 0; border-radius: var(--radius-full); background: var(--muted-bg); font-size: 13px; }
  .c .chip.on { background: var(--ink); color: var(--paper); }

  .input { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); }
  .input span { flex: 1; display: flex; align-items: center; padding: 0 16px; color: var(--sub); font-size: 14px; }
  .b .input { border-radius: var(--radius-lg); }
  .b .input .btn { height: 40px; border-radius: var(--radius-md); }
  @supports (corner-shape: superellipse(1.25)) { .a .btn i, .c .go i, .input, .c .btn, .c .chip, .a .btn { corner-shape: round; } .b .input { corner-shape: superellipse(1.25); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <section class="col a">
      <span class="tag">A · 刻度</span>
      <div class="meta"><b>01</b><span>生成</span><span>2026</span></div>
      <h1>一句话，<br /><span>长出一件家具。</span></h1>
      <p>先起稿，再出图，最后评审。</p>
      <div class="row"><button class="btn">开始设计 <i>↗</i></button><button class="btn btn--line">看看案例</button></div>
      <div class="row"><a class="link" href="#">打开工作台</a></div>
      <div class="row"><span class="chip">浅木</span><span class="chip">小公寓</span><span class="chip">轻一点</span></div>
      <div class="input"><span>一把浅木小椅子</span><button class="btn">生成 <i>↗</i></button></div>
    </section>
    <section class="col b">
      <span class="tag">B · 材质</span>
      <span class="eyebrowless"><i>v2</i>扶手再薄一点</span>
      <h1>一句话，<br /><strong>长出一件家具。</strong></h1>
      <p>先起稿，再出图，最后评审。</p>
      <div class="row"><button class="btn">开始设计</button><button class="btn btn--glass">看看案例</button><button class="btn btn--olive">生成</button></div>
      <div class="row"><span class="seg"><button class="on">单次</button><button>迭代</button></span></div>
      <div class="input"><span>一把浅木小椅子</span><button class="btn">生成</button></div>
    </section>
    <section class="col c">
      <span class="tag">C · 编辑</span>
      <span class="num">01</span>
      <h1>一句话，长出<mark>一件家具</mark>。</h1>
      <p>先起稿，再出图，最后评审。</p>
      <div class="row"><a class="go" href="#">开始设计 <i>→</i></a></div>
      <div class="row"><button class="btn btn--fill">生成</button><button class="btn">看看案例</button></div>
      <div class="row"><button class="chip on">椅</button><button class="chip">桌案</button><button class="chip">柜</button></div>
      <div class="input"><span>一把浅木小椅子</span><button class="btn btn--fill">生成</button></div>
    </section>
  </div>
</div>
</body>
</html>

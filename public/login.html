<!doctype html>
<html lang="zh-CN" data-theme="day" data-locale="cn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="登录木生·AI，继续你的家具作品。" />
    <title data-ui-copy>登录 · 木生·AI</title>
    <link rel="icon" href="/assets/brand/musheng-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/ui/tokens.css" />
    <link rel="stylesheet" href="/ui/components.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-visual" aria-labelledby="welcome-title">
        <img class="login-visual__art" src="/assets/hero-tall.webp" width="1080" height="1320" alt="" />
        <a class="login-brand" href="/"><img class="login-brand__mark" src="/assets/brand/musheng-icon-64.png" srcset="/assets/brand/musheng-icon-64.png 2x, /assets/brand/musheng-icon-96.png 3x" width="32" height="32" alt="" /><span data-ui-copy>木生</span></a>
        <h1 class="login-visual__title" id="welcome-title">
          <span data-ui-copy>欢迎回来，</span>
          <span data-ui-copy>继续你的作品。</span>
        </h1>
      </section>

      <section class="login-form-shell" aria-labelledby="authTitle">
        <div class="yui-segmented locale-switch" role="group" aria-label="语言" data-ui-attrs="aria-label" data-locale-switch><button class="yui-segment" type="button" data-locale-set="cn" lang="zh-CN" aria-pressed="true">中</button><button class="yui-segment" type="button" data-locale-set="tw" lang="zh-TW" aria-pressed="false">繁</button><button class="yui-segment" type="button" data-locale-set="en" lang="en" aria-pressed="false">EN</button></div>
        <div class="login-form-card">
          <h2 id="authTitle" data-ui-copy>登录</h2>
          <form class="login-form" id="authForm" action="/api/v1/auth/login" method="post">
            <label class="login-field" id="nameField" hidden>
              <span data-ui-copy>称呼</span>
              <input id="displayName" name="displayName" type="text" autocomplete="nickname" maxlength="40" />
            </label>
            <label class="login-field">
              <span data-ui-copy>邮箱</span>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                autocapitalize="none"
                inputmode="email"
                spellcheck="false"
                required
              />
            </label>
            <div class="login-field">
              <label for="password" data-ui-copy>密码</label>
              <span class="password-control">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  minlength="8"
                  maxlength="256"
                  required
                />
                <button id="passwordToggle" type="button" aria-pressed="false" data-ui-copy>显示</button>
              </span>
            </div>
            <p class="login-message" id="authMessage" data-ui-copy role="alert" aria-live="polite"></p>
            <button class="login-submit" id="authSubmit" type="submit" data-ui-copy>登录</button>
          </form>
          <p class="login-switch">
            <span id="authSwitchText" data-ui-copy>没有账号？</span>
            <button id="authModeToggle" type="button" data-ui-copy>注册</button>
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
